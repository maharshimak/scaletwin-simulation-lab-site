name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scaletwin-site-v2.tar.gz'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out website archive
        uses: actions/checkout@v4
      - name: Extract verified website files
        run: |
          echo '52d96dd596465dfcb8dfa5833cd71a06e7f683017b05c98c15714000777663dd  scaletwin-site-v2.tar.gz' | sha256sum --check --status
          mkdir -p site
          tar -xzf scaletwin-site-v2.tar.gz -C site
          test -f site/index.html
          test -d site/_next
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
